<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GE Addon 기능 현황</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">GE ADDON</p>
      <h1>기능 개발 현황</h1>
      <p class="intro">복잡한 내부 기록 없이, 현재 상태만 요약합니다.</p>
    </header>

    <section class="summary" aria-label="전체 요약">
      <article class="progress-card">
        <span class="label">전체 진행률</span>
        <strong data-progress>--%</strong>
        <div class="track" aria-hidden="true"><span data-progress-bar></span></div>
      </article>
      <article class="meta-card">
        <div><span class="label">게시 당시 작업 차례</span><strong data-turn>--</strong></div>
        <div><span class="label">마지막 갱신</span><strong data-updated>--</strong></div>
      </article>
    </section>

    <section class="feature-section" aria-labelledby="feature-title">
      <div class="section-heading"><h2 id="feature-title">기능별 상태</h2><span>상태 4단계</span></div>
      <div class="features" data-features aria-live="polite"></div>
      <p class="error" data-error role="alert" hidden></p>
    </section>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
